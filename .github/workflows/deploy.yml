name: deploy

on:
  push:
    branches: [main]

# NOTE: write, because the Grow step may commit grown tiles back to main.
permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # NOTE: deploy steps are gated on secrets presence. Until the DEPLOY_*
    # secrets are set, runs still check, skip the rsync, and stay green.
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          # NOTE: full history. grow.py dates an experiment without
          # <meta name="date"> by its first commit; a shallow clone would
          # date it today and flip the tile on every run.
          fetch-depth: 0

      # NOTE: grow tiles from notes/ and experiments/. If that changed
      # anything, commit it back to main as Nim. A push made with
      # GITHUB_TOKEN does not trigger another workflow run, so this does
      # not loop; this same run goes on to check and deploy the grown tree.
      - name: Grow
        run: |
          python3 scripts/grow.py
          if ! git diff --quiet -- index.html view.html; then
            git config user.name "Nim"
            git config user.email "nim@aesv.io"
            git add index.html view.html
            git commit -m "grow: tiles from notes/ and experiments/"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Check
        run: bash scripts/check.sh

      - name: Skip, not provisioned
        if: env.DEPLOY_HOST == ''
        run: echo "No DEPLOY_HOST secret set; not provisioned. Checks ran. Skipping deploy."

      - name: Rsync repo root to docroot
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          rsync -avz --delete \
            --exclude=/.git --exclude=/.github --exclude=/scripts \
            --exclude=/README.md --exclude=/AGENTS.md --exclude=/CLAUDE.md \
            --exclude=/WRITING.md --exclude=/LICENSE --exclude=/.gitignore --exclude=.DS_Store \
            -e "ssh -i $HOME/.ssh/id_ed25519 -p $DEPLOY_PORT" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:${DEPLOY_PATH%/}/"
