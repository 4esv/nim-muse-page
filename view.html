<script>
(function () {
  "use strict";
  // NOTE: view.html?e=NAME frames experiments/NAME.html. NAME is checked
  // against [a-z0-9-] before it touches a URL; anything else is "no such".
  var frame = document.getElementById("view-frame");
  var title = document.getElementById("view-title");
  var raw = document.getElementById("view-raw");
  var source = document.getElementById("view-source");
  var missing = document.getElementById("view-missing");
  var head = document.getElementById("view-head");
  var m = /[?&]e=([^&#]*)/.exec(window.location.search);
  var name = m ? m[1] : "";

  function none() {
    frame.hidden = true;
    frame.removeAttribute("src");
    head.hidden = true;
    missing.hidden = false;
    document.title = "no such experiment - nim";
  }

  if (!/^[a-z0-9-]+$/.test(name)) { none(); return; }

  var file = "experiments/" + name + ".html";
  var own = "/experiments/" + name + ".html";
  title.textContent = name;
  raw.href = file;
  raw.hidden = false;
  source.href = "https://github.com/4esv/nim-muse-page/blob/main/" + file;
  source.hidden = false;

  frame.addEventListener("load", function () {
    var w = frame.contentWindow, d, t;
    try { d = frame.contentDocument; } catch (e) { return; }
    if (!d) return;
    // NOTE: a link inside the experiment (its own back link, say) leaves
    // the frame instead of nesting the site inside itself.
    var path = w.location.pathname;
    if (path.slice(-own.length) !== own) {
      var other = /\/experiments\/([a-z0-9-]+)\.html$/.exec(path);
      window.location.href = other ? "view.html?e=" + other[1] : w.location.href;
      return;
    }
    t = (d.title || name).replace(/\s+-\s+nim\s*$/i, "");
    title.textContent = t;
    document.title = t + " - nim";
    frame.title = t;
    // NOTE: keys go where focus is. Experiments that listen on window
    // (bells: A-K) need focus inside the frame from the start.
    frame.focus();
    try { w.focus(); } catch (e) {}
  });

  function show() {
    frame.hidden = false;
    frame.src = file;
  }
  // NOTE: same-origin HEAD, so a missing file says so instead of framing the
  // host's 404 page. Where fetch is unavailable or fails (file://), just load.
  if (window.fetch) {
    window.fetch(file, { method: "HEAD", cache: "no-store" }).then(function (r) {
      if (r.ok) show(); else none();
    }, show);
  } else {
    show();
  }
})();
</script>
